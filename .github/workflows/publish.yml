name: Publish website to TransIP

# Every merge to main publishes the website to aidecis.com (TransIP web hosting) over SFTP, then
# checks that the live site serves the published files in main (excluding generated status/).
# Files on the server that are not in the repository are never deleted (for example server-side
# scripts), so publishing only adds and
# overwrites. A manual run can do a dry run first, or publish an earlier commit to roll back:
# Actions > Publish website to TransIP > Run workflow.
#
# Setup, once (see docs/publishing.md):
#   repository variables  TRANSIP_SFTP_HOST, TRANSIP_SFTP_USER, TRANSIP_SFTP_PATH (e.g. www),
#                         TRANSIP_SFTP_KNOWN_HOSTS (the server's host key line, pinned)
#   repository secret     TRANSIP_SFTP_KEY (a dedicated publish key, preferred) or
#                         TRANSIP_SFTP_PASSWORD (entered by Neil); never in the repository
# Until TRANSIP_SFTP_HOST is set, this workflow does nothing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be uploaded
        type: boolean
        default: true
      ref:
        description: Commit, tag or branch to publish (empty = main). Use an earlier commit to roll back.
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  publish:
    if: vars.TRANSIP_SFTP_HOST != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Collect the publishable files
        run: |
          set -euo pipefail
          mkdir -p site
          cp ./*.html ./*.txt sitemap.xml site/
          cp -R assets demo demo-v9.1 site/
          find site -type f | wc -l | xargs echo "files to publish:"

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null

      - name: Pin the server's host key
        env:
          KNOWN_HOSTS: ${{ vars.TRANSIP_SFTP_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KNOWN_HOSTS" || { echo "TRANSIP_SFTP_KNOWN_HOSTS is not set; refusing to connect without a pinned host key."; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 ~/.ssh/known_hosts

      - name: Upload over SFTP
        env:
          SFTP_KEY: ${{ secrets.TRANSIP_SFTP_KEY }}
          LFTP_PASSWORD: ${{ secrets.TRANSIP_SFTP_PASSWORD }}
          HOST: ${{ vars.TRANSIP_SFTP_HOST }}
          SFTP_USER: ${{ vars.TRANSIP_SFTP_USER }}
          REMOTE: ${{ vars.TRANSIP_SFTP_PATH }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          # A dedicated publish key (preferred) or the SFTP password; one of the two secrets must be set.
          SSH_OPTS="-a -x -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          if [ -n "$SFTP_KEY" ]; then
            printf '%s\n' "$SFTP_KEY" > ~/.ssh/publish_key && chmod 600 ~/.ssh/publish_key
            SSH_OPTS="$SSH_OPTS -i $HOME/.ssh/publish_key -o IdentitiesOnly=yes"
            export LFTP_PASSWORD=unused
          fi
          test -n "$LFTP_PASSWORD" || { echo "Set the TRANSIP_SFTP_KEY or TRANSIP_SFTP_PASSWORD secret."; exit 1; }
          lftp -c "
            set sftp:connect-program 'ssh $SSH_OPTS';
            set net:max-retries 3; set net:timeout 30;
            open --env-password -u \"$SFTP_USER\" sftp://$HOST;
            mirror --reverse --verbose=1 --parallel=4 --exclude '^status(/|$)' $DRY site \"$REMOTE\"
          "

      - name: Check the live site
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          sleep 5
          bad=0
          n=0
          # status/ is independently generated. Never compare its live files to main.
          # Every other published file, nested folders included; paths are URL-encoded.
          while IFS= read -r -d '' f; do
            rel="${f#site/}"
            url="https://aidecis.com/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$rel")?v=${GITHUB_RUN_ID}"
            n=$((n+1))
            if ! curl -fsS "$url" | cmp -s - "$f"; then echo "differs on the live site: $rel"; bad=1; fi
          done < <(find site -path site/status -prune -o -type f -print0)
          test $bad = 0 && echo "aidecis.com serves the $n published files of $(git rev-parse --short HEAD) (status/ excluded)."
          exit $bad
